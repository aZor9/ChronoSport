<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChronoSport - 4 Fantastiques</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050c1a">
  <meta name="apple-mobile-web-app-title" content="ChronoSport">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="ChronoSport - minuteur 4 Fantastiques, accessible via sport.hugo-lembrez.fr.">
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">
        <main class="app-surface rounded-4 shadow-lg p-3 p-md-4 p-lg-5">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">4 Fantastiques</h1>
            <div class="small text-secondary">Écran <span id="wakeStatus" class="fw-semibold text-info">Inactif</span></div>
          </div>

          <div class="text-center py-3 py-md-4">
            <div id="stage" class="fw-semibold text-uppercase small text-info mb-2" aria-live="polite">Prêt</div>
            <div id="timeDisplay" class="timer-display text-white">00:00</div>
            <div id="soundHint" class="small text-warning mt-2" hidden>🔇 Touchez l'écran pour réactiver les bips</div>
          </div>

          <div class="d-flex flex-wrap gap-2 justify-content-center mb-3">
            <button id="startBtn" class="btn btn-info px-4">Démarrer</button>
            <button id="pauseBtn" class="btn btn-outline-light px-3" hidden>Pause</button>
            <button id="resetBtn" class="btn btn-light px-3" hidden>Reset</button>
          </div>

          <!-- Grille d'avancement : 4 colonnes = 4 parties, lignes = exos -->
          <div class="mb-3">
            <div id="overview" class="overview-grid" role="list" aria-label="Vue d'ensemble des exercices"></div>
          </div>

          <div class="mb-3">
            <div class="progress mb-2">
              <div id="progressBar" class="progress-bar" role="progressbar" aria-label="Progression de la séquence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
          </div>

          <div class="d-grid d-md-flex justify-content-md-between">
            <a href="index.html" class="btn btn-sm btn-outline-light">Aller à l'accueil</a>
          </div>
        </main>
      </div>
    </div>
  </div>

  <footer class="container pb-4">
    <div class="app-surface rounded-4 px-3 py-3 d-flex flex-wrap gap-2 justify-content-between align-items-center">
      <div class="small text-secondary">
        <span>ChronoSport</span>
        <span class="mx-1">•</span>
        <a class="footer-link" href="https://sport.hugo-lembrez.fr/" target="_blank" rel="noopener noreferrer">sport.hugo-lembrez.fr</a>
        <span class="mx-1">•</span>
        <a class="footer-link" href="mailto:contact@hugo-lembrez.fr">contact@hugo-lembrez.fr</a>
      </div>
      <a class="btn btn-sm btn-outline-light" href="mentions-legales.html">Mentions légales</a>
    </div>
  </footer>

  <script src="assets/chrono.js"></script>
  <script src="assets/4fantastiques.js"></script>
  <script src="/assets/pwa.js"></script>
</body>
</html>
