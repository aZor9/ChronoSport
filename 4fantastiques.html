<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronomètre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Theme colors: increased contrast for accessibility */
    :root{
      --bg:#071022; /* page background */
      --card:#071626; /* card background (slightly lighter than page) */
      --accent:#38bdf8;
      --muted:#f1f5f9; /* very light muted color for high contrast */
      --text:#e6eef6;
      --border:rgba(255,255,255,0.08);
    }
    body{background:linear-gradient(180deg,#071022 0%,#071626 100%);color:var(--text);font-family:Inter,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    .card{background:var(--card);border:1px solid rgba(255,255,255,0.03);border-radius:12px}
    .big-time{font-weight:700;font-size:clamp(2.4rem,5vw,4rem);letter-spacing:2px}
    .sub{color:var(--muted)}
    .btn-accent{background:var(--accent);color:#042028}
    .progress{height:12px;border-radius:8px;background:rgba(255,255,255,0.04)}
    .stage-label{font-weight:700}
    .small-muted{font-size:.9rem;color:var(--muted)}
    .controls .form-control{background:transparent;color:inherit;border-color:var(--border)}
    .toggle-wake{cursor:pointer}
    footer{opacity:.75;font-size:.85rem}

  /* Overview grid styles (compact + phone-friendly) */
  /* use auto columns so cells don't stretch to full width; grid centered */
  .overview-grid{display:grid;grid-template-columns:repeat(4,auto);gap:8px;justify-content:center;justify-items:center}
  /* smaller fixed-size boxes (won't fill parent), centered in grid */
  .overview-cell{width:44px;height:44px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* hide labels for now (can be restored by removing display:none) */
  .overview-cell .label{font-size:.7rem;color:var(--muted);text-align:center;display:none}
  /* Emoji larger for visibility inside small cell */
  .overview-cell .status{font-size:2.4rem;line-height:1;margin-top:0}
  .status-done{color:#16a34a} /* green */
  .status-now{color:#0ea5e9} /* blue */
  .status-empty{color:rgba(255,255,255,0.12)}

  /* Extra small phones: make boxes a bit smaller but keep emoji readable */
  @media (max-width:420px){
    .overview-cell{width:40px;height:40px;padding:3px;border-radius:6px}
    .overview-cell .status{font-size:2.6rem}
    .overview-grid{gap:6px}
  }

  @media (min-width:421px) and (max-width:768px){
    .overview-cell{width:46px;height:46px}
    .overview-cell .status{font-size:2.6rem}
  }

    /* Responsiveness improvements */
    .controls{gap:.5rem}
    /* default button sizing (desktop) */
    .controls .btn{min-width:110px}
    /* Tablet: relax min-width so buttons don't overflow */
    @media (max-width:992px){
      .controls .btn{min-width:90px;padding-left:.5rem;padding-right:.5rem;font-size:.9rem}
      /* slightly smaller big time on tablets */
      .big-time{font-size:4rem}
      .card{padding:1rem}
    }
    @media (max-width:768px){
      /* slightly larger timer on small mobile devices for readability */
      .big-time{font-size:3.5rem}
      .controls{flex-wrap:wrap}
      .controls .btn{flex:1;min-width:0}
      .card{padding:1rem}
    }

    /* Add hover effect for control buttons */
    .controls .btn:hover {
      border: 2px solid var(--accent);
    }

    /* Make bootstrap's text-muted lighten to match theme */
    .text-muted{color:var(--muted) !important}

    /* Ensure headings are bright on the dark background */
    h1,h2,h3,h4,h5,h6{ color:var(--text); }

    /* Make main display texts explicitly bright for readability */
    #stage, #timeDisplay, #roundInfo { color: #ffffff; }

    /* Small tweaks so input labels and lists are clearer */
    label.form-label{color:var(--muted)}
    ul.small-muted{color:var(--muted);margin-left:1rem}
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card p-4 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h3 class="mb-0">Chronomètre - 4 Fantastiques</h3>
            </div>
            <div class="text-end">
              <div class="small-muted">Écran <span id="wakeStatus" class="fw-bold">Inactif</span></div>
            </div>
          </div>

          <div class="text-center py-3">
            <div id="stage" class="stage-label mb-2">Prêt</div>
            <div id="timeDisplay" class="big-time">00:00</div>
            <!-- Removed roundInfo -->
          </div>

          <div class="d-flex gap-2 justify-content-center mb-3 controls">
            <button id="startBtn" class="btn btn-accent px-4">Démarrer</button>
            <button id="pauseBtn" class="btn btn-outline-light px-3">Pause</button>
            <button id="resetBtn" class="btn btn-light px-3">Reset</button>
          </div>

          <!-- Overview grid: large 4x4 visual helper -->
          <div class="mb-3">
            <div id="overview" class="overview-grid" aria-label="Vue d'ensemble des exercices"></div>
          </div>

          <div class="mb-3">
            <div class="progress mb-2">
              <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%"></div>
            </div>
            <!-- <div class="d-flex justify-content-between small-muted">
              <div id="progressLeft">—</div>
              <div id="progressRight">—</div>
            </div> -->
            <!-- Custom progress indicator -->
            <!-- <div class="text-center mt-2">
              <span id="progressIndicator" class="small-muted">Étape 0/0</span>
            </div> -->
          </div>

          <div class="d-flex justify-content-between">
            <button id="navigateBtn" class="btn btn-sm btn-outline-light">Aller à l'accueil</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="beep"></audio>

  <script>
    // --- Utils ---
    const fmt = (s)=>{ const m=Math.floor(s/60); const sec=s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` }

    // --- Elements ---
    const timeDisplay=document.getElementById('timeDisplay');
    const stageEl=document.getElementById('stage');
    const progressBar=document.getElementById('progressBar');
    const progressLeft=document.getElementById('progressLeft');
    const progressRight=document.getElementById('progressRight');

    const startBtn=document.getElementById('startBtn');
    const pauseBtn=document.getElementById('pauseBtn');
    const resetBtn=document.getElementById('resetBtn');

    const wakeStatus=document.getElementById('wakeStatus');
    const beepEl=document.getElementById('beep');
    beepEl.src = "data:audio/wav;base64,UklGRrQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbQAAAAA"; // tiny silent placeholder

    // --- State ---
    let seq = [
      {label:'Partie 1 : Exos 1', duration:30, type:'work'},
      {label:'Pause', duration:10, type:'rest'},
      {label:'Partie 2 : Exos 1', duration:30, type:'work'},
      {label:'Partie 2 : Exos 2', duration:30, type:'work'},
      {label:'Pause', duration:10, type:'rest'},
      {label:'Partie 3 : Exos 1', duration:30, type:'work'},
      {label:'Partie 3 : Exos 2', duration:30, type:'work'},
      {label:'Partie 3 : Exos 3', duration:30, type:'work'},
      {label:'Pause', duration:10, type:'rest'},
      {label:'Partie 4 : Exos 1', duration:30, type:'work'},
      {label:'Partie 4 : Exos 2', duration:30, type:'work'},
      {label:'Partie 4 : Exos 3', duration:30, type:'work'},
      {label:'Partie 4 : Exos 4', duration:30, type:'work'}
    ];
    let idx = 0;
    let remaining = seq[0].duration;
    let running=false;
    let intervalId=null;
    let totalTime=seq.reduce((a,b)=>a+b.duration,0);
    let elapsed=0;
    let started=false;

    // --- Persist State in LocalStorage ---
    function saveState() {
      const state = {
        idx,
        remaining,
        running,
        started,
        elapsed,
        timestamp: Date.now() // Save the current timestamp
      };
      localStorage.setItem('chronoState', JSON.stringify(state));
    }

    function restoreState() {
      const savedState = localStorage.getItem('chronoState');
      if (savedState) {
        const state = JSON.parse(savedState);
        idx = state.idx;
        remaining = state.remaining;
        running = state.running;
        started = state.started;
        elapsed = state.elapsed;

        // Synchronize the timer based on the elapsed time since the last save
        const lastSavedTime = state.timestamp;
        const now = Date.now();
        const deltaSeconds = Math.floor((now - lastSavedTime) / 1000);

        if (running) {
          remaining -= deltaSeconds;
          elapsed += deltaSeconds;

          // If the current step is completed, move to the next step
          while (remaining <= 0 && idx < seq.length - 1) {
            elapsed += remaining; // Add the negative remaining to elapsed
            idx++;
            remaining += seq[idx].duration;
          }

          // If the sequence is finished, stop the timer
          if (remaining <= 0 && idx >= seq.length - 1) {
            running = false;
            started = false;
            remaining = 0;
            idx = seq.length - 1;
          } else {
            intervalId = setInterval(tick, 1000); // Ensure the timer continues ticking
          }
        }
      }
    }

    // --- Update UI to manage button visibility and text ---
    function updateUI(){
      const current = seq[idx];
      if(!current){
        stageEl.textContent='Prêt';
          timeDisplay.textContent='00:00';
          progressBar.style.width='0%';
          if (progressLeft) progressLeft.textContent='—';
          if (progressRight) progressRight.textContent='—';
          if (typeof progressIndicator !== 'undefined' && progressIndicator) progressIndicator.textContent='Étape 0/0';
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        startBtn.textContent = 'Démarrer';
        return;
      }
      stageEl.textContent = `${current.label} (${current.type})`;
  timeDisplay.textContent = fmt(remaining);
  const pct = Math.min(100, (elapsed/totalTime)*100 || 0);
  progressBar.style.width = pct+'%';
  if (progressLeft) progressLeft.textContent = fmt(Math.max(0,totalTime-elapsed-remaining));
  if (progressRight) progressRight.textContent = fmt(totalTime-elapsed);
  if (typeof progressIndicator !== 'undefined' && progressIndicator) progressIndicator.textContent = `Étape ${idx+1}/${seq.length}`;

      // Manage button visibility and text
      if (!started) {
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        startBtn.textContent = 'Démarrer';
      } else if (running) {
        startBtn.style.display = 'none';
        pauseBtn.style.display = 'inline-block';
        resetBtn.style.display = 'inline-block';
      } else {
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
        resetBtn.style.display = 'inline-block';
        startBtn.textContent = 'Reprendre';
      }
      // Update the overview grid visual
      try{ renderOverview(); }catch(e){ /* ignore if overview not ready */ }
    }

    // --- Wake Lock ---
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeStatus.textContent = 'Actif';
        }
      } catch (err) {
        console.error('Failed to acquire wake lock:', err);
      }
    }

    async function releaseWakeLock() {
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
          wakeStatus.textContent = 'Inactif';
        }
      } catch (err) {
        console.error('Failed to release wake lock:', err);
      }
    }

    // --- Timer Logic ---
    function tick(){
      if(!running) return;
      if(remaining>0){ remaining--; elapsed++; updateUI(); saveState(); if(remaining<=3 && remaining>0) playBeep(remaining); }
      else {
        playBeep(0);
        idx++;
        if(idx>=seq.length){
          running=false; started=false; clearInterval(intervalId); intervalId=null; stageEl.textContent='Terminé'; timeDisplay.textContent='00:00'; progressBar.style.width='100%';
          saveState();
          return;
        }
        remaining = seq[idx].duration;
        updateUI();
        saveState();
      }
    }

    function start(){ if(!seq.length) return; if(!running){ running=true; started=true; intervalId = setInterval(tick,1000); saveState(); requestWakeLock(); } }
    function pause(){ running=false; if(intervalId){ clearInterval(intervalId); intervalId=null; saveState(); releaseWakeLock(); } }
    function reset(){ pause(); started=false; idx=0; remaining=seq[0].duration; elapsed=0; updateUI(); saveState(); }

    // --- Event Listeners ---
    startBtn.addEventListener('click', ()=>{ start(); updateUI(); });
    pauseBtn.addEventListener('click', ()=>{ if(running) pause(); else start(); updateUI(); });
    resetBtn.addEventListener('click', ()=>{ reset(); updateUI(); });

    // Navigation button
    const navigateBtn = document.getElementById('navigateBtn');
    navigateBtn.addEventListener('click', ()=>{
      releaseWakeLock(); // Release wake lock before navigating
      window.location.href = 'index.html';
    });

    function playBeep(n){
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine';
        o.frequency.value = n>0? 880 : 440;
        g.gain.value = 0.6;
        o.connect(g); g.connect(ctx.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        o.stop(ctx.currentTime + 0.19);
      }catch(e){ console.warn('Audio API not available',e); }
    }

    // Restore state on page load
    restoreState();
    // Build and render overview grid (4 columns = 4 parties, rows = exos)
    function buildOverview(){
      const ov = document.getElementById('overview');
      if(!ov) return;
      ov.innerHTML = '';
      // create 4x4 = 16 cells, row-major order so cellIndex = row*4 + col
      for(let r=0;r<4;r++){
        for(let c=0;c<4;c++){
          const cell = document.createElement('div');
          cell.className = 'overview-cell';
          cell.dataset.row = r; cell.dataset.col = c;
          const lbl = document.createElement('div'); lbl.className='label'; lbl.textContent = ``;
          const st = document.createElement('div'); st.className='status status-empty'; st.innerHTML='';
          cell.appendChild(lbl); cell.appendChild(st);
          ov.appendChild(cell);
        }
      }
    }

    function renderOverview(){
      const ov = document.getElementById('overview');
      if(!ov) return;
      const cells = ov.querySelectorAll('.overview-cell');
      // Extract work items and group them by Partie number (1..4)
      const workItems = [];
      seq.forEach((s,i)=>{
        if(s.type === 'work'){
          // try to parse "Partie N" and optional Exos M
          const m = /Partie\s*(\d+)/i.exec(s.label);
          const part = m ? Math.max(1, Math.min(4, parseInt(m[1],10))) : 1;
          workItems.push({i, label: s.label, part});
        }
      });

      // Build columns: for part 1..4, get its items in sequence order
      const cols = [[],[],[],[]];
      workItems.forEach(w=>{ const p = (w.part||1)-1; if(p<0||p>3) return; cols[p].push(w); });

      // Fill cells: for each cell at (row, col) map to cols[col][row]
      cells.forEach(cell=>{
        const r = parseInt(cell.dataset.row,10);
        const c = parseInt(cell.dataset.col,10);
        const lbl = cell.querySelector('.label');
        const st = cell.querySelector('.status');
        const item = (cols[c] && cols[c][r]) ? cols[c][r] : null;
        if(item){
          lbl.textContent = item.label.length>16? item.label.slice(0,16)+'…': item.label;
        } else {
          lbl.textContent = '';
        }

        if(!item){
          st.textContent=''; st.className='status status-empty';
        } else if(item.i < idx){
          st.textContent='🟩'; st.className='status status-done';
        } else if(item.i === idx){
          st.textContent = running? '⏳' : '🟦'; st.className='status status-now';
        } else {
          st.textContent=''; st.className='status status-empty';
        }
      });
    }

    buildOverview();
    updateUI();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
