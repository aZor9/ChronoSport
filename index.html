<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChronoSport - Chronomètre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231a2a6c'/%3E%3Cstop offset='100%25' stop-color='%236b0f3b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='50' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle'%3E⏰%3C/text%3E%3C/svg%3E">
  <meta name="description" content="ChronoSport: minuteur Tabata et 4 Fantastiques, hébergé sur GitHub Pages via sport.hugo-lembrez.fr.">
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <main class="app-surface rounded-4 shadow-lg p-3 p-md-4 p-lg-5">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">ChronoSport</h1>
            <div class="small text-secondary">Écran <span id="wakeStatus" class="fw-semibold text-info">Inactif</span></div>
          </div>

          <div class="row g-4">
            <div class="col-md-6 d-flex flex-column">
              <div class="text-center py-3 py-md-4">
                <div id="stage" class="fw-semibold text-uppercase small text-info mb-2" aria-live="polite">Prêt</div>
                <div id="timeDisplay" class="timer-display text-white">00:00</div>
                <div class="small text-secondary mt-2" id="roundInfo">Séquence : —</div>
                <div id="soundHint" class="small text-warning mt-2" hidden>🔇 Touchez l'écran pour réactiver les bips</div>
              </div>

              <div class="d-flex flex-wrap gap-2 justify-content-center mb-3">
                <button id="startBtn" class="btn btn-info px-4">Démarrer</button>
                <button id="pauseBtn" class="btn btn-outline-light px-3" hidden>Pause</button>
                <button id="resetBtn" class="btn btn-light px-3" hidden>Reset</button>
              </div>

              <div class="mb-3">
                <div class="progress mb-2" style="height: 12px;">
                  <div id="progressBar" class="progress-bar" role="progressbar" aria-label="Progression de la séquence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div>
                </div>
              </div>

              <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-auto">
                <button id="presetTabata" class="btn btn-outline-secondary btn-sm">Preset Tabata (20/10 x8)</button>
                <button id="preset4F" class="btn btn-outline-secondary btn-sm">4 Fantastiques</button>
                <button id="customStart" class="btn btn-outline-secondary btn-sm">Lancer avec mes réglages</button>
              </div>
            </div>

            <div class="col-md-6">
              <div class="p-3 rounded-3 border border-secondary-subtle bg-dark bg-opacity-25 mb-3">
                <h2 class="h6 mb-3">Réglages Tabata</h2>
                <div class="row g-2">
                  <div class="col-6">
                    <label for="tabataWork" class="form-label small text-secondary">Durée Ex (sec)</label>
                    <input id="tabataWork" type="number" inputmode="numeric" class="form-control" value="20" min="1">
                  </div>
                  <div class="col-6">
                    <label for="tabataRest" class="form-label small text-secondary">Pause (sec)</label>
                    <input id="tabataRest" type="number" inputmode="numeric" class="form-control" value="10" min="0">
                  </div>
                  <div class="col-6">
                    <label for="tabataRounds" class="form-label small text-secondary">Répétitions</label>
                    <input id="tabataRounds" type="number" inputmode="numeric" class="form-control" value="8" min="1">
                  </div>
                  <div class="col-6">
                    <label for="countIn" class="form-label small text-secondary">Précompte (sec)</label>
                    <input id="countIn" type="number" inputmode="numeric" class="form-control" value="5" min="0">
                  </div>
                </div>
              </div>

              <div class="p-3 rounded-3 border border-secondary-subtle bg-dark bg-opacity-25">
                <h2 class="h6 mb-3">Options</h2>
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" id="loopToggle">
                  <label class="form-check-label small text-secondary" for="loopToggle">Relancer automatiquement la séquence</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="soundOn" checked>
                  <label class="form-check-label small text-secondary" for="soundOn">Bips / Alarmes</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="wakeLockToggle" checked>
                  <label class="form-check-label small text-secondary" for="wakeLockToggle">Empêcher l'écran de s'éteindre</label>
                </div>
              </div>
            </div>
          </div>

          <hr class="my-4 border-secondary-subtle">
          <div class="d-flex gap-2 flex-wrap">
            <button id="importBtn" class="btn btn-sm btn-outline-light">Importer séquence</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
            <button id="exportBtn" class="btn btn-sm btn-outline-light">Exporter séquence</button>
            <a href="4fantastiques.html" class="btn btn-sm btn-outline-light">Page 4 Fantastiques</a>
          </div>
        </main>
      </div>
    </div>
  </div>

  <footer class="container pb-4">
    <div class="app-surface rounded-4 px-3 py-3 d-flex flex-wrap gap-2 justify-content-between align-items-center">
      <div class="small text-secondary">
        <span>ChronoSport</span>
        <span class="mx-1">•</span>
        <a class="footer-link" href="https://sport.hugo-lembrez.fr/" target="_blank" rel="noopener noreferrer">sport.hugo-lembrez.fr</a>
        <span class="mx-1">•</span>
        <a class="footer-link" href="mailto:contact@hugo-lembrez.fr">contact@hugo-lembrez.fr</a>
      </div>
      <a class="btn btn-sm btn-outline-light" href="mentions-legales.html">Mentions légales</a>
    </div>
  </footer>

  <script src="assets/chrono.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);

    // --- Elements ---
    const el = { stage: $('stage'), time: $('timeDisplay'), progress: $('progressBar'), baseTitle: document.title };
    const controls = { startBtn: $('startBtn'), pauseBtn: $('pauseBtn'), resetBtn: $('resetBtn') };
    const roundInfo = $('roundInfo');
    const inputs = { tabataWork: $('tabataWork'), tabataRest: $('tabataRest'), tabataRounds: $('tabataRounds'), countIn: $('countIn') };
    const loopToggle = $('loopToggle');
    const soundOn = $('soundOn');
    const wakeLockToggle = $('wakeLockToggle');

    // --- Réglages persistés ---
    const SETTINGS_KEY = 'chronoSport:settings:v1';
    const TABATA_DEFAULTS = { tabataWork: 20, tabataRest: 10, tabataRounds: 8, countIn: 5 };

    function loadSettings(){
      const s = Chrono.storage.get(SETTINGS_KEY) || {};
      for (const k in inputs) if (Number.isFinite(s[k])) inputs[k].value = s[k];
      if (typeof s.loop === 'boolean') loopToggle.checked = s.loop;
      if (typeof s.sound === 'boolean') soundOn.checked = s.sound;
      if (typeof s.wakeLock === 'boolean') wakeLockToggle.checked = s.wakeLock;
    }
    function saveSettings(){
      const s = { loop: loopToggle.checked, sound: soundOn.checked, wakeLock: wakeLockToggle.checked };
      for (const k in inputs) s[k] = Number(inputs[k].value);
      Chrono.storage.set(SETTINGS_KEY, s);
    }

    // --- Séquences ---
    const intVal = (input, min, fallback) => Math.max(min, Math.floor(Number(input.value) || fallback));

    function buildTabata(){
      const w = intVal(inputs.tabataWork, 1, 20);
      const r = intVal(inputs.tabataRest, 0, 10);
      const rounds = intVal(inputs.tabataRounds, 1, 8);
      const ci = Math.max(0, Math.floor(Number(inputs.countIn.value) || 0));
      const s = [];
      if (ci > 0) s.push({ label: 'Précompte', duration: ci, type: 'countin' });
      for (let i = 1; i <= rounds; i++) {
        s.push({ label: `Exercice ${i}`, duration: w, type: 'work' });
        if (i < rounds && r > 0) s.push({ label: `Pause ${i}`, duration: r, type: 'rest' });
      }
      return s;
    }

    function build4Fantastiques(){
      return [
        { label: 'Ex 1', duration: 30, type: 'work' },
        { label: 'Pause 1', duration: 10, type: 'rest' },
        { label: 'Ex 2', duration: 60, type: 'work' },
        { label: 'Pause 2', duration: 10, type: 'rest' },
        { label: 'Ex 3', duration: 90, type: 'work' },
        { label: 'Pause 3', duration: 10, type: 'rest' },
        { label: 'Ex 4', duration: 120, type: 'work' }
      ];
    }

    // --- Minuteur ---
    const beep = (high) => { if (soundOn.checked) Chrono.audio.beep(high); };

    function syncWake(snap){
      if (snap.running && wakeLockToggle.checked) Chrono.wake.acquire();
      else Chrono.wake.release();
    }

    const timer = Chrono.createTimer({
      storageKey: 'chronoSport:index:v2',
      hooks: {
        render(snap){
          Chrono.renderCommon(snap, el);
          roundInfo.textContent = snap.finished
            ? `Séquence terminée · ${Chrono.fmt(snap.totalSec)}`
            : `Étape ${snap.idx + 1}/${snap.seq.length} · Total restant ${Chrono.fmt(snap.totalLeftSec)}`;
        },
        state(snap){ Chrono.renderControls(snap, controls); syncWake(snap); updateSoundHint(); },
        step(){ beep(false); },
        countdown(){ beep(true); },
        finish(){ beep(false); }
      }
    });

    const updateSoundHint = Chrono.bindSoundHint($('soundHint'), () => soundOn.checked && timer.snapshot().running);
    Chrono.wake.onChange((status) => { $('wakeStatus').textContent = status; });

    // Évite d'écraser par mégarde une séquence en cours.
    function confirmReplace(){
      const snap = timer.snapshot();
      return !snap.started || snap.finished || confirm('Une séquence est en cours. La remplacer ?');
    }

    // --- Event bindings ---
    controls.startBtn.addEventListener('click', () => timer.start());
    controls.pauseBtn.addEventListener('click', () => timer.pause());
    controls.resetBtn.addEventListener('click', () => timer.reset());

    $('presetTabata').addEventListener('click', () => {
      if (!confirmReplace()) return;
      for (const k in inputs) inputs[k].value = TABATA_DEFAULTS[k];
      saveSettings();
      timer.load(buildTabata(), { preset: 'tabata' });
    });
    $('preset4F').addEventListener('click', () => {
      if (!confirmReplace()) return;
      timer.load(build4Fantastiques(), { preset: '4f' });
    });
    $('customStart').addEventListener('click', () => {
      if (!confirmReplace()) return;
      timer.load(buildTabata(), { preset: 'custom' });
      timer.start();
    });

    for (const k in inputs) inputs[k].addEventListener('change', saveSettings);
    loopToggle.addEventListener('change', () => { saveSettings(); timer.setLoop(loopToggle.checked); });
    soundOn.addEventListener('change', () => { saveSettings(); updateSoundHint(); });
    wakeLockToggle.addEventListener('change', () => { saveSettings(); syncWake(timer.snapshot()); });

    $('exportBtn').addEventListener('click', () => {
      const seq = timer.seq;
      if (!seq.length) return alert('Aucune séquence chargée');
      const blob = new Blob([JSON.stringify(seq, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'sequence.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    const importFile = $('importFile');
    $('importBtn').addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = Chrono.validateSeq(JSON.parse(e.target.result));
          if (!confirmReplace()) return;
          timer.load(data, { preset: 'import' });
          alert('Séquence importée avec succès');
        } catch (err) {
          console.error(err);
          alert('Erreur lors de l\'import : ' + err.message);
        } finally { importFile.value = ''; }
      };
      reader.onerror = () => { alert('Impossible de lire le fichier'); importFile.value = ''; };
      reader.readAsText(f);
    });

    // Raccourci : touche 4 = lancer les 4 Fantastiques (ignoré pendant la saisie)
    document.addEventListener('keydown', (e) => {
      if (e.key !== '4' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
      if (!confirmReplace()) return;
      timer.load(build4Fantastiques(), { preset: '4f' });
      timer.start();
    });

    // --- Init : restaure l'état (même en cours de séance), sinon preset Tabata ---
    loadSettings();
    if (!timer.restore()) timer.load(buildTabata(), { preset: 'tabata' });
    timer.setLoop(loopToggle.checked);
  </script>
</body>
</html>
